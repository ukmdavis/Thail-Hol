<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Holiday Planner</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Holiday planner</h1>
    <div class="row" style="align-items:center;">
      <span id="authControl"></span>
      <button class="primary requires-edit" id="showFormBtn">+ Add holiday</button>
    </div>
  </header>

  <div class="card" id="addForm" style="display:none;">
    <h2>New holiday</h2>
    <label>Name</label>
    <input id="f-name" placeholder="e.g. Thailand, Frankfurt weekend" />
    <label>Destination</label>
    <input id="f-destination" placeholder="e.g. Hua Hin, Frankfurt" />
    <div class="grid-2">
      <div>
        <label>Depart date</label>
        <input id="f-depart" type="date" />
      </div>
      <div>
        <label>Return date</label>
        <input id="f-return" type="date" />
      </div>
    </div>
    <label>Start planning from</label>
    <select id="f-lead">
      <option value="7">7 days before departure</option>
      <option value="14">14 days before departure</option>
      <option value="21">21 days before departure</option>
      <option value="30" selected>30 days before departure</option>
      <option value="45">45 days before departure</option>
      <option value="60">60 days before departure</option>
      <option value="90">90 days before departure</option>
    </select>
    <label style="display:flex; align-items:center; gap:8px; margin-top:14px;">
      <input type="checkbox" id="f-secret" style="width:auto;" />
      This is a surprise (hide details until a reveal date)
    </label>
    <div id="revealDateWrap" style="display:none;">
      <label>Reveal date &amp; time</label>
      <input id="f-reveal" type="datetime-local" />
    </div>
    <div class="row" style="margin-top:14px;">
      <button class="primary" id="saveBtn">Save</button>
      <button id="cancelBtn">Cancel</button>
    </div>
  </div>

  <div class="trip-list" id="tripList"></div>

  <p style="margin-top: 2rem; text-align: center;">
    <a href="admin.html" class="organiser-only" style="font-size: 13px; color: var(--text-secondary);">Manage Trips &amp; People</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script>
const showFormBtn = document.getElementById("showFormBtn");
const addForm = document.getElementById("addForm");
const cancelBtn = document.getElementById("cancelBtn");
const saveBtn = document.getElementById("saveBtn");
const secretCheckbox = document.getElementById("f-secret");
const revealWrap = document.getElementById("revealDateWrap");
const tripList = document.getElementById("tripList");

showFormBtn.onclick = () => { addForm.style.display = "block"; };
cancelBtn.onclick = () => { addForm.style.display = "none"; };
secretCheckbox.onchange = () => { revealWrap.style.display = secretCheckbox.checked ? "block" : "none"; };

saveBtn.onclick = async () => {
  const name = document.getElementById("f-name").value.trim();
  const destination = document.getElementById("f-destination").value.trim();
  const depart_date = document.getElementById("f-depart").value;
  const return_date = document.getElementById("f-return").value;
  const is_secret = secretCheckbox.checked;
  const reveal_at = is_secret ? document.getElementById("f-reveal").value : null;
  const lead_days = parseInt(document.getElementById("f-lead").value, 10);

  if (!name || !depart_date || !return_date) {
    alert("Please fill in name, depart date and return date.");
    return;
  }
  if (is_secret && !reveal_at) {
    alert("Please set a reveal date and time.");
    return;
  }

  try {
    await HolidayData.addHoliday({ name, destination, depart_date, return_date, is_secret, reveal_at, lead_days });
    addForm.style.display = "none";
    loadTrips();
  } catch (e) {
    alert("Could not save: " + e.message);
  }
};

async function loadTrips() {
  tripList.innerHTML = "<p class='empty'>Loading...</p>";
  try {
    const allTrips = await HolidayData.listHolidays();
    const now = new Date();
    const trips = allTrips.filter(t =>
      Auth.isOrganiser() || !(t.is_secret && t.reveal_at && now < new Date(t.reveal_at))
    );
    if (trips.length === 0) {
      tripList.innerHTML = "<p class='empty'>No holidays yet. Add your first one above.</p>";
      return;
    }
    tripList.innerHTML = "";
    trips.forEach(t => {
      const days = daysBetween(new Date(), t.depart_date);
      const statusText = days > 0 ? `${days} days to go` : days === 0 ? "Departs today" : "In progress / past";
      const el = document.createElement("a");
      el.className = "trip-link";
      el.href = `trip.html?id=${t.id}`;
      el.innerHTML = `
        <div class="row" style="justify-content:space-between; align-items:center;">
          <h3>${t.name}</h3>
          ${t.is_secret ? '<span class="badge">Surprise</span>' : ''}
        </div>
        <div class="dest">${t.destination || ""}</div>
        <div class="dates">${formatDate(t.depart_date)} — ${formatDate(t.return_date)} · ${statusText}</div>
      `;
      tripList.appendChild(el);
    });
  } catch (e) {
    tripList.innerHTML = `<p class='empty'>Couldn't load trips: ${e.message}. Check your Supabase config in js/config.js.</p>`;
  }
}

(async () => {
  if (!await Auth.requireAuth()) return;
  Auth.renderControl(document.getElementById("authControl"));
  loadTrips();
})();
</script>
</body>
</html>
