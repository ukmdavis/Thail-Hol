<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trip details</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">&larr; All holidays</a>
  <div id="content"><p class="empty">Loading...</p></div>
</div>

<div id="textModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h3 id="modalTitle">Note</h3>
    <textarea id="modalInput" rows="4"></textarea>
    <div class="row" style="margin-top:12px; justify-content:flex-end;">
      <button id="modalCancel">Cancel</button>
      <button class="primary" id="modalSave">Save</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const tripId = params.get("id");
const content = document.getElementById("content");

function openTextModal(title, current) {
  return new Promise(resolve => {
    const overlay = document.getElementById("textModal");
    const input = document.getElementById("modalInput");
    document.getElementById("modalTitle").textContent = title;
    input.value = current || "";
    overlay.style.display = "flex";
    setTimeout(() => input.focus(), 0);

    const saveBtn = document.getElementById("modalSave");
    const cancelBtn = document.getElementById("modalCancel");

    function finish(value) {
      overlay.style.display = "none";
      saveBtn.onclick = null;
      cancelBtn.onclick = null;
      overlay.onclick = null;
      resolve(value);
    }

    saveBtn.onclick = () => finish(input.value);
    cancelBtn.onclick = () => finish(null);
    overlay.onclick = (e) => { if (e.target === overlay) finish(null); };
  });
}

function cleanText(text) {
  return (text || "")
    .replace(/\r\n?/g, "\n")            // normalize Windows/old-Mac line endings to \n
    .split("\n")
    .map(line => line.trim())           // strip leading/trailing spaces on each line
    .join("\n")
    .replace(/\n{2,}/g, "\n")           // collapse any run of blank lines to one
    .trim();
}

function escapeHtml(str) {
  return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Applied at render time so even old notes saved before the cleanup fix
// always display compactly, without needing to re-save them.
function displayText(text) {
  return escapeHtml(cleanText(text || ""));
}

function isAdmin() {
  if (sessionStorage.getItem("hp_admin") === "1") return true;
  if (params.get("admin") === "1") {
    const val = prompt("Enter passcode to view/edit this trip early:");
    if (val === ADMIN_PASSCODE) {
      sessionStorage.setItem("hp_admin", "1");
      return true;
    }
  }
  return false;
}

async function main() {
  if (!tripId) { content.innerHTML = "<p class='empty'>No trip specified.</p>"; return; }

  let trip;
  try {
    trip = await HolidayData.getHoliday(tripId);
  } catch (e) {
    content.innerHTML = `<p class='empty'>Couldn't load trip: ${e.message}</p>`;
    return;
  }

  const admin = params.get("admin") === "1" ? isAdmin() : false;

  if (trip.is_secret && trip.reveal_at && new Date() < new Date(trip.reveal_at) && !admin) {
    renderLockScreen(trip);
    return;
  }

  renderTrip(trip, admin);
}

function renderLockScreen(trip) {
  const reveal = new Date(trip.reveal_at);
  content.innerHTML = `
    <div class="card lock-screen">
      <div class="icon">🎁</div>
      <h2>Something special is coming</h2>
      <p style="color:var(--text-secondary); margin-top:8px;">Details for this trip unlock on</p>
      <p style="font-weight:600; margin-top:4px;">${reveal.toLocaleString("en-GB", { weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit" })}</p>
      <div class="countdown-num" id="countdown"></div>
    </div>
  `;
  const el = document.getElementById("countdown");
  function tick() {
    const diff = reveal - new Date();
    if (diff <= 0) { location.reload(); return; }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    el.textContent = d > 0 ? `${d}d ${h}h ${m}m` : `${h}h ${m}m`;
  }
  tick();
  setInterval(tick, 60000);
}

async function renderTrip(trip, admin) {
  const daysUntil = daysBetween(new Date(), trip.depart_date);
  content.innerHTML = `
    ${admin ? `<div class="badge" style="margin-bottom:10px; display:inline-block;">Admin view — viewing early</div>` : ""}
    <div class="card" id="headerCard">
      <div class="row" style="justify-content:space-between; align-items:start;">
        <div>
          <h2>${trip.name}</h2>
          <p style="color:var(--text-secondary); font-size:13px; margin-top:2px;">${trip.destination || ""}</p>
          <p style="color:var(--text-secondary); font-size:13px; margin-top:6px;">${formatDate(trip.depart_date)} — ${formatDate(trip.return_date)}</p>
          ${trip.is_secret ? `<p style="font-size:13px; margin-top:6px;"><span class="badge">Surprise</span> reveals ${new Date(trip.reveal_at).toLocaleString("en-GB")}</p>` : ""}
        </div>
        <div class="row">
          <button id="editTripBtn">Edit</button>
          <button class="danger" id="deleteTripBtn">Delete</button>
        </div>
      </div>
      <div id="editTripForm" style="display:none; margin-top:14px; border-top:1px solid var(--border); padding-top:14px;"></div>
    </div>
    <div class="countdown-banner">${daysUntil > 0 ? daysUntil + " days until departure" : daysUntil === 0 ? "Departs today!" : "Trip in progress or past"}</div>

    <div class="section-title">Flights</div>
    <div id="flightsList"></div>
    <button id="addFlightBtn">+ Add flight</button>
    <div class="card" id="flightForm" style="display:none; margin-top:10px;"></div>

    <div class="section-title">Accommodation</div>
    <div id="staysList"></div>
    <button id="addStayBtn">+ Add stay</button>
    <div class="card" id="stayForm" style="display:none; margin-top:10px;"></div>

    <div class="section-title">Photos</div>
    <div class="card">
      <label>Add a photo</label>
      <input type="file" id="photoInput" accept="image/*" multiple />
      <label>Caption (optional)</label>
      <input type="text" id="photoCaption" placeholder="e.g. Sunset at Hua Hin beach" />
      <div class="row" style="margin-top:12px; align-items:center;">
        <button class="primary" id="uploadPhotoBtn">Upload</button>
        <span id="uploadStatus" class="empty"></span>
      </div>
    </div>
    <div id="photoGrid"></div>

    <div class="section-title">Day by day — tasks &amp; notes</div>
    <p class="empty" style="margin-bottom:10px;">Covers the run-up to departure and the trip itself, so you can plan ahead for both.</p>
    <div id="dayTimeline"></div>
  `;

  document.getElementById("deleteTripBtn").onclick = async () => {
    if (!confirm("Delete this holiday and everything in it?")) return;
    await HolidayData.deleteHoliday(trip.id);
    location.href = "index.html";
  };

  document.getElementById("editTripBtn").onclick = () => toggleEditTripForm(trip);
  document.getElementById("addFlightBtn").onclick = () => toggleFlightForm(trip.id);
  document.getElementById("addStayBtn").onclick = () => toggleStayForm(trip.id);
  document.getElementById("uploadPhotoBtn").onclick = () => handleUpload(trip.id);

  await loadFlights(trip.id);
  await loadStays(trip.id);
  await loadPhotos(trip.id);
  await loadTimeline(trip);
}

// ---------- Photos ----------
async function handleUpload(tripId) {
  const input = document.getElementById("photoInput");
  const captionEl = document.getElementById("photoCaption");
  const status = document.getElementById("uploadStatus");
  const files = Array.from(input.files || []);

  if (files.length === 0) { alert("Choose a photo first."); return; }

  const tooBig = files.find(f => f.size > 10 * 1024 * 1024);
  if (tooBig) { alert(`"${tooBig.name}" is larger than 10MB. Please pick a smaller image.`); return; }

  try {
    for (let i = 0; i < files.length; i++) {
      status.textContent = `Uploading ${i + 1} of ${files.length}...`;
      await HolidayData.uploadPhoto(tripId, files[i], captionEl.value);
    }
    status.textContent = "Done.";
    input.value = "";
    captionEl.value = "";
    await loadPhotos(tripId);
    setTimeout(() => { status.textContent = ""; }, 2000);
  } catch (e) {
    status.textContent = "";
    alert("Upload failed: " + e.message);
  }
}

async function loadPhotos(tripId) {
  const grid = document.getElementById("photoGrid");
  let photos;
  try {
    photos = await HolidayData.listPhotos(tripId);
  } catch (e) {
    grid.innerHTML = `<p class='empty'>Couldn't load photos: ${e.message}</p>`;
    return;
  }
  if (photos.length === 0) { grid.innerHTML = "<p class='empty'>No photos yet.</p>"; return; }

  grid.className = "photo-grid";
  grid.innerHTML = "";
  photos.forEach(p => {
    const url = HolidayData.photoUrl(p.storage_path);
    const tile = document.createElement("div");
    tile.className = "photo-tile";
    tile.innerHTML = `<img src="${url}" alt="${(p.caption || "Trip photo").replace(/"/g,'&quot;')}" loading="lazy" /><button class="photo-del">✕</button>${p.caption ? `<div class="photo-caption">${escapeHtml(p.caption)}</div>` : ""}`;
    tile.querySelector("img").onclick = () => window.open(url, "_blank");
    tile.querySelector(".photo-del").onclick = async (e) => {
      e.stopPropagation();
      if (!confirm("Delete this photo?")) return;
      await HolidayData.deletePhoto(p);
      loadPhotos(tripId);
    };
    grid.appendChild(tile);
  });
}

function toggleEditTripForm(trip) {
  const form = document.getElementById("editTripForm");
  if (form.style.display === "block") { form.style.display = "none"; return; }
  form.style.display = "block";
  const revealLocal = trip.reveal_at ? new Date(trip.reveal_at).toISOString().slice(0,16) : "";
  form.innerHTML = `
    <label>Name</label>
    <input id="et-name" value="${trip.name || ""}" />
    <label>Destination</label>
    <input id="et-destination" value="${trip.destination || ""}" />
    <div class="grid-2">
      <div><label>Depart date</label><input id="et-depart" type="date" value="${trip.depart_date || ""}" /></div>
      <div><label>Return date</label><input id="et-return" type="date" value="${trip.return_date || ""}" /></div>
    </div>
    <label>Start planning from</label>
    <select id="et-lead">
      ${[7,14,21,30,45,60,90].map(d => `<option value="${d}" ${(trip.lead_days ?? 45) === d ? "selected" : ""}>${d} days before departure</option>`).join("")}
    </select>
    <label style="display:flex; align-items:center; gap:8px; margin-top:14px;">
      <input type="checkbox" id="et-secret" ${trip.is_secret ? "checked" : ""} style="width:auto;" />
      This is a surprise (hide from main page until reveal date)
    </label>
    <div id="et-revealWrap" style="display:${trip.is_secret ? "block" : "none"};">
      <label>Reveal date &amp; time</label>
      <input id="et-reveal" type="datetime-local" value="${revealLocal}" />
    </div>
    <div class="row" style="margin-top:14px;">
      <button class="primary" id="et-save">Save changes</button>
      <button id="et-cancel">Cancel</button>
    </div>
  `;
  document.getElementById("et-secret").onchange = (e) => {
    document.getElementById("et-revealWrap").style.display = e.target.checked ? "block" : "none";
  };
  document.getElementById("et-cancel").onclick = () => { form.style.display = "none"; };
  document.getElementById("et-save").onclick = async () => {
    const is_secret = document.getElementById("et-secret").checked;
    const reveal_at = is_secret ? document.getElementById("et-reveal").value : null;
    if (is_secret && !reveal_at) { alert("Please set a reveal date and time."); return; }
    await HolidayData.updateHoliday(trip.id, {
      name: document.getElementById("et-name").value.trim(),
      destination: document.getElementById("et-destination").value.trim(),
      depart_date: document.getElementById("et-depart").value,
      return_date: document.getElementById("et-return").value,
      lead_days: parseInt(document.getElementById("et-lead").value, 10),
      is_secret,
      reveal_at,
    });
    location.reload();
  };
}

async function loadFlights(tripId) {
  const list = document.getElementById("flightsList");
  const flights = await HolidayData.listFlights(tripId);
  if (flights.length === 0) { list.innerHTML = "<p class='empty'>No flights added yet.</p>"; return; }
  list.innerHTML = "";
  flights.forEach(f => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="field-row" style="align-items:start;">
        <div>
          <span class="badge">${f.direction || ""}</span>
          <h3 style="margin-top:6px;">${f.airline || ""} ${f.flight_number || ""}</h3>
          <p style="font-size:13px; color:var(--text-secondary); margin-top:4px;">${f.from_airport || "?"} → ${f.to_airport || "?"}</p>
          <p style="font-size:13px; color:var(--text-secondary); margin-top:4px;">${formatDateTime(f.depart_at)} → ${formatDateTime(f.arrive_at)}</p>
          ${f.notes ? `<p style="font-size:13px; margin-top:4px;">${f.notes}</p>` : ""}
        </div>
        <div class="row" style="flex-shrink:0;">
          <button class="edit-btn">Edit</button>
          <button class="ghost del-btn">✕</button>
        </div>
      </div>
      <div class="editRow" style="display:none; margin-top:12px; border-top:1px solid var(--border); padding-top:12px;"></div>
    `;
    card.querySelector(".del-btn").onclick = async () => { await HolidayData.deleteFlight(f.id); loadFlights(tripId); };
    card.querySelector(".edit-btn").onclick = () => toggleFlightEdit(card, f, tripId);
    list.appendChild(card);
  });
}

// ---------- Day by day timeline (covers run-up AND the holiday itself) ----------
async function loadTimeline(trip) {
  const wrap = document.getElementById("dayTimeline");
  const items = await HolidayData.listDayItems(trip.id);

  const today = new Date(); today.setHours(0,0,0,0);
  const depart = new Date(trip.depart_date);
  const returnD = new Date(trip.return_date);
  const leadDays = trip.lead_days ?? 45;

  // Start from today, but never further back than this trip's own
  // planning window (lead_days) before departure.
  let start = new Date(Math.min(today.getTime(), depart.getTime()));
  if (daysBetween(start, depart) > leadDays) {
    start = new Date(depart.getTime() - leadDays * 86400000);
  }

  const end = returnD >= start ? returnD : start; // always show at least through return date
  const todayStr = today.toISOString().split("T")[0];
  const departStr = trip.depart_date;

  const days = [];
  let cursor = new Date(start);
  while (cursor <= end) {
    days.push(cursor.toISOString().split("T")[0]);
    cursor.setDate(cursor.getDate() + 1);
  }

  wrap.innerHTML = "";
  days.forEach(dateStr => {
    const dayItems = items.filter(i => i.item_date === dateStr);
    const isToday = dateStr === todayStr;
    const daysOut = daysBetween(dateStr, trip.depart_date);
    const onTrip = dateStr >= departStr;
    const card = document.createElement("div");
    card.className = "card day-card" + (isToday ? " today" : "");
    let itemsHtml = "";
    dayItems.forEach(item => {
      if (item.type === "task") {
        itemsHtml += `<div class="item-row ${item.done ? "done" : ""}"><input type="checkbox" ${item.done ? "checked" : ""} class="task-toggle" data-id="${item.id}" /><span class="item-text" data-id="${item.id}" data-current="${cleanText(item.text).replace(/"/g,'&quot;')}">${displayText(item.text)}</span><button class="ghost item-delete" data-id="${item.id}">✕</button></div>`;
      } else {
        itemsHtml += `<div class="note-block" data-id="${item.id}" data-current="${cleanText(item.text).replace(/"/g,'&quot;')}"><span class="note-text">${displayText(item.text)}</span><button class="ghost item-delete" data-id="${item.id}">✕</button></div>`;
      }
    });
    card.innerHTML = `
      <div class="field-row">
        <div>
          <div class="date-label">${formatDate(dateStr, { weekday: "short", day: "numeric", month: "short" })}</div>
          <div class="days-out">${daysOut === 0 ? "Departure day" : daysOut > 0 ? daysOut + " days before departure" : onTrip ? "During your trip" : ""}</div>
        </div>
        ${onTrip ? '<span class="badge">Trip day</span>' : ''}
      </div>
      <div style="margin-top:8px;">${itemsHtml}</div>
      <div class="row" style="margin-top:8px;">
        <button class="add-task" data-date="${dateStr}">+ Task</button>
        <button class="add-note" data-date="${dateStr}">+ Note</button>
      </div>
    `;
    wrap.appendChild(card);
  });

  wrap.querySelectorAll(".task-toggle").forEach(cb => {
    cb.onchange = async () => { await HolidayData.toggleTaskDone(cb.dataset.id, cb.checked); loadTimeline(trip); };
  });
  wrap.querySelectorAll(".item-delete").forEach(btn => {
    btn.onclick = async () => { await HolidayData.deleteDayItem(btn.dataset.id); loadTimeline(trip); };
  });
  wrap.querySelectorAll(".item-text, .note-block").forEach(el => {
    el.onclick = async (e) => {
      if (e.target.tagName === "BUTTON") return;
      const id = el.dataset.id;
      const current = el.dataset.current;
      const text = await openTextModal("Edit", current);
      if (text === null || text.trim() === "") return;
      await HolidayData.updateDayItemText(id, cleanText(text));
      loadTimeline(trip);
    };
  });
  wrap.querySelectorAll(".add-task").forEach(btn => {
    btn.onclick = async () => {
      const text = await openTextModal("New task", "");
      if (!text || !text.trim()) return;
      await HolidayData.addDayItem({ holiday_id: trip.id, item_date: btn.dataset.date, type: "task", text: cleanText(text) });
      loadTimeline(trip);
    };
  });
  wrap.querySelectorAll(".add-note").forEach(btn => {
    btn.onclick = async () => {
      const text = await openTextModal("New note", "");
      if (!text || !text.trim()) return;
      await HolidayData.addDayItem({ holiday_id: trip.id, item_date: btn.dataset.date, type: "note", text: cleanText(text) });
      loadTimeline(trip);
    };
  });
}

main();
</script>
</body>
</html>
