<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Holiday Planner</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="wrap" style="max-width:400px;">
  <div class="card" style="margin-top:3rem;">
    <h1 style="margin-bottom:6px;">Holiday planner</h1>
    <p style="color:var(--text-secondary); font-size:13px; margin-bottom:1.25rem;">
      Sign in to see the trips.
    </p>

    <div id="formArea">
      <button class="oauth-btn" id="googleBtn">
        <svg viewBox="0 0 18 18" width="17" height="17" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.68-3.89 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider"><span>or</span></div>

      <label>Email address</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
      <button class="primary" id="sendBtn" style="width:100%; margin-top:10px;">Email me a sign-in link</button>
      <p id="msg" class="empty" style="margin-top:10px;"></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
const emailEl = document.getElementById("email");
const sendBtn = document.getElementById("sendBtn");
const msg = document.getElementById("msg");

// Already signed in? Go straight through.
(async () => {
  const session = await Auth.init();
  if (session) location.href = "index.html";
})();

async function oauth(provider) {
  msg.textContent = "";
  try {
    await Auth.signInWithProvider(provider);
  } catch (e) {
    msg.textContent = "Couldn't sign in: " + e.message;
  }
}

document.getElementById("googleBtn").onclick = () => oauth("google");

async function send() {
  const email = emailEl.value.trim();
  if (!email || !email.includes("@")) { msg.textContent = "Please enter a valid email address."; return; }

  sendBtn.disabled = true;
  msg.textContent = "Sending...";
  try {
    await Auth.sendMagicLink(email);
    document.getElementById("formArea").innerHTML = `
      <p style="font-size:14px;">Check your inbox — we've sent a sign-in link to <strong>${email}</strong>.</p>
      <p class="empty" style="margin-top:8px;">It may take a minute to arrive, and can land in spam.</p>
    `;
  } catch (e) {
    msg.textContent = "Couldn't send: " + e.message;
    sendBtn.disabled = false;
  }
}

sendBtn.onclick = send;
emailEl.onkeydown = (e) => { if (e.key === "Enter") send(); };
</script>
</body>
</html>
